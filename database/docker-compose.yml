services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: azimutt
      POSTGRES_PASSWORD: azimutt
      POSTGRES_DB: azimutt
    volumes:
      - azimutt_db:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:8025:8025"

  azimutt:
    image: ghcr.io/azimuttapp/azimutt:main
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      PHX_SERVER: "true"
      PHX_HOST: localhost
      PORT: "4000"
      SECRET_KEY_BASE: "changeme_at_least_64_chars_long_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
      DATABASE_URL: "postgresql://azimutt:azimutt@db/azimutt"
      FILE_STORAGE_ADAPTER: local
      AUTH_PASSWORD: "true"
      ORGANIZATION_DEFAULT_PLAN: enterprise
      EMAIL_ADAPTER: smtp
      SMTP_RELAY: mailpit
      SMTP_PORT: "1025"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SENDER_EMAIL: azimutt@localhost
    depends_on:
      - db
      - mailpit

volumes:
  azimutt_db:
