services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: azimutt
      POSTGRES_PASSWORD: azimutt
      POSTGRES_DB: azimutt
    volumes:
      - azimutt_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U azimutt"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025/api/v1/info > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  azimutt:
    image: ghcr.io/azimuttapp/azimutt:main
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      PHX_SERVER: "true"
      PHX_HOST: azimutt.badweb.de
      PORT: "4000"
      SECRET_KEY_BASE: "0r6hwqWB8GDVp4jFVRUE+fMNG1pjEN6zWz/KFzVW2n5hvSA3vm0/j1iBqTmiP482"
      DATABASE_URL: "postgresql://azimutt:azimutt@db/azimutt"
      FILE_STORAGE_ADAPTER: local
      AUTH_PASSWORD: "true"
      ORGANIZATION_DEFAULT_PLAN: enterprise
      EMAIL_ADAPTER: smtp
      SMTP_RELAY: mailpit
      SMTP_PORT: "1025"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SENDER_EMAIL: azimutt@badweb.de
    depends_on:
      - db
      - mailpit
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000 > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  patch:
    image: postgres:16
    restart: on-failure
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until psql postgresql://azimutt:azimutt@db/azimutt -c '\dt organizations' 2>/dev/null | grep -q organizations; do
          echo 'Waiting for Azimutt migrations...'; sleep 5
        done
        psql postgresql://azimutt:azimutt@db/azimutt -c \
          "UPDATE organizations SET plan = 'enterprise', plan_seats = 99, plan_status = 'active', plan_freq = 'yearly', plan_validated = now();"
    depends_on:
      - db

volumes:
  azimutt_db:
