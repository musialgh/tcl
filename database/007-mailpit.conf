<VirtualHost *:80>
	ServerName mailpit.badweb.de

	RewriteEngine on
	RewriteCond %{SERVER_NAME} =mailpit.badweb.de
	RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
	<VirtualHost *:443>
		# mailpit docker
		ProxyPreserveHost On
		ProxyPass        / http://127.0.0.1:8025/
		ProxyPassReverse / http://127.0.0.1:8025/

		ServerName mailpit.badweb.de
		UseCanonicalName On

		ServerAdmin webmaster@mailpit.badweb.de

		# DocumentRoot is unused (pure proxy), but Apache needs the dir to exist to avoid warnings
		DocumentRoot /var/www/mailpit.badweb.de/html

		ErrorLog ${APACHE_LOG_DIR}/error.log
		CustomLog ${APACHE_LOG_DIR}/access.log combined

		SSLEngine on

		SSLCertificateFile	  /etc/letsencrypt/live/badweb.de/fullchain.pem
		SSLCertificateKeyFile	/etc/letsencrypt/live/badweb.de/privkey.pem
		Include /etc/letsencrypt/options-ssl-apache.conf
	</VirtualHost>
</IfModule>

